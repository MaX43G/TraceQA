# 溯知 / TraceQA 知识库服务配置
server:
  port: ${SERVER_PORT:8084}

spring:
  application:
    name: traceqa-kb-service
  main:
    web-application-type: servlet
  threads:
    virtual:
      enabled: true
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      timeout: 6s
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    locations: classpath:db/migration
    # 已有表但无历史表时，将其作为基线（跳过已存在的 V1，不重复建表）
    baseline-on-migrate: true
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${PG_HOST:localhost}:${PG_PORT:5432}/${PG_DATABASE_KB:traceqa_kb}?currentSchema=public
    username: ${PG_USER:traceqa}
    password: ${PG_PASSWORD:traceqa123}

# MyBatis-Plus
mybatis-plus:
  global-config:
    banner: false
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# 应用配置
app:
  # 本地文件存储根目录（文档本体）
  storage:
    root: ${APP_STORAGE_ROOT:./data/files}
  # LightRAG（文档入库）
  lightrag:
    base-url: ${LIGHTRAG_BASE_URL:http://localhost:9621}
    api-key: ${LIGHTRAG_API_KEY:}
    top-k: ${LIGHTRAG_TOP_K:8}
    connect-timeout: 5000
    read-timeout: 120000

# springdoc
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    edu.zjut.traceqa: info
