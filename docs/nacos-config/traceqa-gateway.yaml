# ============================================================
# 溯知 / TraceQA 网关服务完整配置（Nacos DataId: traceqa-gateway.yaml）
# ============================================================
server:
  port: ${SERVER_PORT:8080}

spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 6s
  threads:
    virtual:
      enabled: true
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false
          default-filters:
            - name: Retry
              args:
                retries: 3
                statuses: SERVICE_UNAVAILABLE
                methods: GET,POST,PUT,DELETE
                backoff:
                  firstBackoff: 500ms
                  maxBackoff: 2000ms
          routes:
            # ---- 用户服务 ----
            - id: traceqa-user-service-auth
              uri: lb://traceqa-user-service
              predicates:
                - Path=/api/auth/**
            - id: traceqa-user-service-admin
              uri: lb://traceqa-user-service
              predicates:
                - Path=/api/admin/**
            # ---- 文件服务 ----
            - id: traceqa-file-service
              uri: lb://traceqa-file-service
              predicates:
                - Path=/api/files/**
            # ---- 知识库服务 ----
            - id: traceqa-kb-service
              uri: lb://traceqa-kb-service
              predicates:
                - Path=/api/kbs/**,/api/documents/**
            # ---- 问答服务 ----
            - id: traceqa-qa-service
              uri: lb://traceqa-qa-service
              predicates:
                - Path=/api/chat/**,/api/models/**,/api/prompts/**
            # ---- 管理服务 ----
            - id: traceqa-admin-service
              uri: lb://traceqa-admin-service
              predicates:
                - Path=/api/announcement/**,/api/monitor/**,/api/health
            # ---- 反向代理 ----
            - id: traceqa-admin-proxy
              uri: lb://traceqa-admin-service
              predicates:
                - Path=/lightrag-webui/**,/grafana/**,/prometheus/**,/dbx/**,/nacos/**,/docs,/redoc,/openapi.json
            # ---- API 文档聚合 ----
            - id: traceqa-user-service-docs
              uri: lb://traceqa-user-service
              predicates:
                - Path=/user/v3/api-docs
              filters:
                - RewritePath=/user/v3/api-docs, /v3/api-docs
            - id: traceqa-file-service-docs
              uri: lb://traceqa-file-service
              predicates:
                - Path=/file/v3/api-docs
              filters:
                - RewritePath=/file/v3/api-docs, /v3/api-docs
            - id: traceqa-kb-service-docs
              uri: lb://traceqa-kb-service
              predicates:
                - Path=/kb/v3/api-docs
              filters:
                - RewritePath=/kb/v3/api-docs, /v3/api-docs
            - id: traceqa-qa-service-docs
              uri: lb://traceqa-qa-service
              predicates:
                - Path=/qa/v3/api-docs
              filters:
                - RewritePath=/qa/v3/api-docs, /v3/api-docs
            - id: traceqa-admin-service-docs
              uri: lb://traceqa-admin-service
              predicates:
                - Path=/admin/v3/api-docs
              filters:
                - RewritePath=/admin/v3/api-docs, /v3/api-docs

# Sa-Token 配置
sa-token:
  token-name: Authorization
  token-prefix: Bearer
  token-style: uuid
  timeout: 86400
  active-timeout: -1
  is-concurrent: false
  is-share: false
  is-log: false

# springdoc 网关聚合
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    urls:
      - name: 用户服务
        url: /user/v3/api-docs
      - name: 文件服务
        url: /file/v3/api-docs
      - name: 知识库服务
        url: /kb/v3/api-docs
      - name: 问答服务
        url: /qa/v3/api-docs
      - name: 管理服务
        url: /admin/v3/api-docs

# 网关自定义配置
traceqa:
  gateway:
    public-paths:
      - /api/auth/login
      - /api/auth/register
      - /api/health
      - /api/announcement/active

# 可观测性
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,loggers
      base-path: /actuator
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    edu.zjut.traceqa: info
