# ============================================================
# 溯知 / TraceQA 知识库服务完整配置（Nacos DataId: traceqa-kb-service.yaml）
# ============================================================
server:
  port: ${SERVER_PORT:8084}

spring:
  threads:
    virtual:
      enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 6s
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB
  encoding:
    charset: UTF-8
    enabled: true
    force: true
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${PG_HOST:localhost}:${PG_PORT:5432}/${PG_DATABASE_KB:traceqa_kb}?currentSchema=public
    username: ${PG_USER:traceqa}
    password: ${PG_PASSWORD:traceqa123}

# MyBatis-Plus
mybatis-plus:
  global-config:
    banner: false
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# 应用配置
app:
  storage:
    root: ${APP_STORAGE_ROOT:./data/files}
  lightrag:
    base-url: ${LIGHTRAG_BASE_URL:http://localhost:9621}
    api-key: ${LIGHTRAG_API_KEY:}
    top-k: ${LIGHTRAG_TOP_K:8}
    connect-timeout: 5000
    read-timeout: 120000
    datasource:
      jdbc-url: jdbc:postgresql://${PG_HOST:localhost}:${PG_PORT:5432}/traceqa_lightrag?currentSchema=public
      username: ${PG_USER:traceqa}
      password: ${PG_PASSWORD:traceqa123}
  elasticsearch:
    host: ${ES_HOST:localhost}
    port: ${ES_PORT:9200}
    index-name: traceqa_chunks

# springdoc
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# 可观测性
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,loggers
      base-path: /actuator
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    edu.zjut.traceqa: info
