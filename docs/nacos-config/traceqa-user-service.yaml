# ============================================================
# 溯知 / TraceQA 用户服务完整配置（Nacos DataId: traceqa-user-service.yaml）
# ============================================================
server:
  port: ${SERVER_PORT:8081}

spring:
  threads:
    virtual:
      enabled: true
  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 5000
            read-timeout: 60000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 6s
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB
  encoding:
    charset: UTF-8
    enabled: true
    force: true
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${PG_HOST:localhost}:${PG_PORT:5432}/${PG_DATABASE_USER:traceqa_user}?currentSchema=public
    username: ${PG_USER:traceqa}
    password: ${PG_PASSWORD:traceqa123}

# Sa-Token 配置
sa-token:
  token-name: Authorization
  token-prefix: Bearer
  token-style: uuid
  timeout: 86400
  active-timeout: -1
  is-concurrent: false
  is-share: false
  is-log: false

# MyBatis-Plus
mybatis-plus:
  global-config:
    banner: false
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# springdoc
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# 可观测性
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,loggers
      base-path: /actuator
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    edu.zjut.traceqa: info
