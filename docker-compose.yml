# ============================================================
# 溯知 / TraceQA 一键部署编排
# 服务：mysql + redis + lightrag + minio + backend(Spring Boot) + frontend(Nuxt SSR) + caddy(HTTPS入口) + prometheus + grafana
#
# 其余所有服务仅内部网络访问（后端/MySQL/Redis/LightRAG/Prometheus/Grafana 均不对外绑定端口）。
#
# HTTPS：无域名时 Caddy 用自签证书（tls internal，自动管理/续期）提供安全上下文，浏览器放行麦克风；
#        有域名后改 frontend/Caddyfile 的 `tls internal` 为 `tls 你的域名` 即可自动申请 Let's Encrypt。
# 资源：不限制 CPU/内存，充分利用服务器资源（Redis 无内存上限、JVM 按可用内存动态分配）。
# 使用：cp .env.example .env && docker compose up -d --build
# ============================================================
name: traceqa

services:
  # 数据库
  mysql:
    image: mysql:latest
    container_name: traceqa-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-traceqa}
      MYSQL_USER: ${MYSQL_USER:-traceqa}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-traceqa123}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      # 首次启动自动建表
      - ./src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - traceqa-mysql-data:/var/lib/mysql
    ports:
      - "6118:3306"
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root123456}" ]
      interval: 10s
      timeout: 5s
      retries: 10

  # Redis：查询/Agent 决策缓存 + 文档处理异步队列
  # 不设内存上限（充分利用服务器资源），开启 AOF 落盘持久化
  redis:
    image: redis:latest
    container_name: traceqa-redis
    restart: unless-stopped
    command: [ "redis-server", "--appendonly", "yes", "--save", "60 1", "--appendfsync", "everysec" ]
    volumes:
      - traceqa-redis-data:/data
    ports:
      - "6117:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # LightRAG 官方 Server（知识图谱 + 向量引擎）
  lightrag:
    image: ghcr.io/hkuds/lightrag:latest
    container_name: traceqa-lightrag
    restart: unless-stopped
    environment:
      # LLM（OpenAI 兼容，硅基流动；LightRAG 需带 /v1，与后端 Spring AI 的 base-url 分离）
      LLM_BINDING: openai
      LLM_BINDING_HOST: ${LIGHTRAG_LLM_BASE_URL:-https://api.siliconflow.cn/v1}
      LLM_BASE_URL: ${LIGHTRAG_LLM_BASE_URL:-https://api.siliconflow.cn/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      OPENAI_API_KEY: ${LLM_API_KEY:-}
      OPENAI_BASE_URL: ${LIGHTRAG_LLM_BASE_URL:-https://api.siliconflow.cn/v1}
      LLM_MODEL: ${LIGHTRAG_LLM_MODEL:-Qwen/Qwen3.5-4B}
      MAX_ASYNC_LLM: ${LIGHTRAG_MAX_ASYNC_LLM:-2}
      MAX_ASYNC_EMBEDDING: ${LIGHTRAG_MAX_ASYNC_EMBEDDING:-4}
      MAX_PARALLEL_INSERT: ${LIGHTRAG_MAX_PARALLEL_INSERT:-1}
      LLM_MAX_RETRIES: 8
      LLM_TIMEOUT: ${LIGHTRAG_LLM_TIMEOUT:-900}
      EMBEDDING_TIMEOUT: ${LIGHTRAG_EMBEDDING_TIMEOUT:-60}
      OPENAI_LLM_MAX_TOKENS: ${LIGHTRAG_LLM_MAX_OUTPUT_TOKENS:-9000}
      MAX_TOKENS: 2000
      EMBEDDING_BINDING: openai
      EMBEDDING_BINDING_HOST: ${LIGHTRAG_LLM_BASE_URL:-https://api.siliconflow.cn/v1}
      EMBEDDING_BASE_URL: ${LIGHTRAG_LLM_BASE_URL:-https://api.siliconflow.cn/v1}
      EMBEDDING_API_KEY: ${LLM_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-m3}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1024}
      EMBEDDING_MAX_TOKEN_SIZE: ${EMBEDDING_MAX_TOKEN_SIZE:-8192}
      # 服务
      PORT: 9621
      WORKING_DIR: /app/data/rag_storage
      # 反向代理前缀：WebUI 与所有 API 都挂在该前缀下，仅经后端 /lightrag-webui/** 代理访问
      LIGHTRAG_API_PREFIX: /lightrag-webui
      LIGHTRAG_API_KEY: ""
      AUTH_ACCOUNTS: ""
      WHITELIST_PATHS: /health
      TOKEN_SECRET: ${LIGHTRAG_TOKEN_SECRET:-}
      TOKEN_EXPIRE_HOURS: ${LIGHTRAG_TOKEN_EXPIRE_HOURS:-48}
    volumes:
      - traceqa-lightrag-data:/app/data
    ports:
      - "6119:9621"
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:9621/health', timeout=5)" ]
      interval: 15s
      timeout: 8s
      retries: 10
      start_period: 30s

  # MinIO 对象存储：统一管理用户上传的文件（如头像）。
  # S3 API（9000）仅内部访问，由 caddy 在 6116 提供 HTTPS 对外。
  minio:
    image: minio/minio:latest
    container_name: traceqa-minio
    restart: unless-stopped
    command: [ "server", "/data", "--console-address", ":9001" ]
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
      TZ: Asia/Shanghai
    volumes:
      - traceqa-minio-data:/data
    ports:
      - "6110:9000"
      - "9001:9001"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 15s
      timeout: 5s
      retries: 10

  # Spring Boot 后端
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: traceqa-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      REDIS_HOST: redis
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-traceqa}
      MYSQL_USER: ${MYSQL_USER:-traceqa}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-traceqa123}
      LIGHTRAG_BASE_URL: http://lightrag:9621
      LIGHTRAG_API_KEY: ""
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-traceqa}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-https://121.41.72.189:6116}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.siliconflow.cn}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-THUDM/GLM-4-9B-0414}
      APP_JWT_SECRET: ${APP_JWT_SECRET:-traceqa-prod-secret-change-me-please-2026}
      APP_STORAGE_ROOT: /app/data/files
      APP_OBSERVABILITY_SCRAPE_TOKEN: ${OBSERVABILITY_SCRAPE_TOKEN:-traceqa-prometheus-scrape-change-me}
      TZ: Asia/Shanghai
    volumes:
      - traceqa-backend-data:/app/data
    ports:
      - "6114:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      lightrag:
        condition: service_healthy

  # Nuxt SSR 前端（内部 3000，由 caddy 提供 HTTPS 对外）
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        API_PROXY_TARGET: http://backend:8080
    container_name: traceqa-frontend
    restart: unless-stopped
    ports:
      - "6109:3000"
    depends_on:
      - backend

  # Caddy：HTTPS 反向代理入口。
  #   6115 -> 前端（HTTPS）
  #   6116 -> MinIO S3（HTTPS，头像公开访问）
  # 无域名用自签证书（tls internal，自动管理），有域名改 Caddyfile 的 tls 即可。
  caddy:
    image: caddy:2-alpine
    container_name: traceqa-caddy
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ./frontend/Caddyfile:/etc/caddy/Caddyfile:ro
      - traceqa-caddy-data:/data
      - traceqa-caddy-config:/config
    ports:
      - "6115:443"
      - "6116:8443"
    depends_on:
      - frontend
      - minio

  # Prometheus：抓取后端 /actuator/prometheus 指标
  prometheus:
    image: prom/prometheus:latest
    container_name: traceqa-prometheus
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -c
      - |
        sed "s/__SCRAPE_TOKEN__/$${OBSERVABILITY_SCRAPE_TOKEN}/g" /etc/prometheus/prometheus.yml > /tmp/prometheus.yml
        exec prometheus --config.file=/tmp/prometheus.yml \
          --web.external-url=/prometheus \
          --web.route-prefix=/prometheus
    environment:
      OBSERVABILITY_SCRAPE_TOKEN: ${OBSERVABILITY_SCRAPE_TOKEN:-traceqa-prometheus-scrape-change-me}
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - backend
    ports:
      - "6112:9090"
  # Grafana：可观测性可视化大盘（仅内部访问，经后端 /grafana/** 代理）
  grafana:
    image: grafana/grafana:latest
    container_name: traceqa-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin123}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_DISABLE_SIGNOUT_MENU: "true"
      GF_AUTH_BASIC_ENABLED: "false"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SERVER_ROOT_URL: /grafana
      GF_SERVER_ENABLE_GZIP: "true"
      TZ: Asia/Shanghai
    volumes:
      - ./docker/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./docker/grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./docker/grafana/dashboard-traceqa.json:/var/lib/grafana/dashboards/traceqa.json:ro
      - traceqa-grafana-data:/var/lib/grafana
    ports:
      - "6113:3000"
    depends_on:
      - prometheus

volumes:
  traceqa-mysql-data:
  traceqa-redis-data:
  traceqa-lightrag-data:
  traceqa-minio-data:
  traceqa-backend-data:
  traceqa-grafana-data:
  traceqa-caddy-data:
  traceqa-caddy-config: