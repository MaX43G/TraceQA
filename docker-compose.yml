# ============================================================
# 溯知 / TraceQA 微服务一键部署编排
# 服务：mysql + redis + nacos + lightrag + minio
#      + gateway + user/file/kb/qa/admin 微服务 + frontend + caddy + prometheus + grafana
#
# 对外仅开放端口：80 / 443 / 6115（Caddy/前端 HTTPS）、6116（MinIO 头像直链）
# 其余微服务端口在容器内开放，供服务间通信；服务器防火墙需阻断非以上四端口的外网访问
#
# 使用：cp .env.example .env && docker compose up -d --build
# ============================================================
name: traceqa

# 默认日志轮转
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "5m"
    max-file: "3"

services:
  # ===================== 基础设施 =====================
  mysql:
    image: mysql:8.4.11
    container_name: traceqa-mysql
    labels: { logging: promtail }
    logging: *default-logging
    restart: unless-stopped
    mem_limit: 1g
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-traceqa}
      MYSQL_USER: ${MYSQL_USER:-traceqa}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-traceqa123}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - ./db:/docker-entrypoint-initdb.d:ro
      - traceqa-mysql-data:/var/lib/mysql
    ports:
      - "6118:3306"
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root123456}" ]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.8.2
    container_name: traceqa-redis
    labels: { logging: promtail }
    logging: *default-logging
    restart: unless-stopped
    mem_limit: 512m
    command: [ "redis-server", "--appendonly", "yes", "--save", "60 1", "--appendfsync", "everysec" ]
    volumes:
      - traceqa-redis-data:/data
    ports:
      - "6117:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Nacos：服务注册与发现（含配置中心）
  nacos:
    image: nacos/nacos-server:v2.5.1
    container_name: traceqa-nacos
    labels: { logging: promtail }
    logging: *default-logging
    restart: unless-stopped
    mem_limit: 1g
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
      JVM_XMS: 256m
      JVM_XMX: 512m
      JVM_XMN: 128m
      TZ: Asia/Shanghai
    ports:
      - "6120:8848"
      - "6121:9848"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://127.0.0.1:8848/nacos/v1/console/health/readiness" ]
      interval: 15s
      timeout: 5s
      retries: 10

  lightrag:
    image: ghcr.io/hkuds/lightrag:latest
    container_name: traceqa-lightrag
    labels: { logging: promtail }
    logging: *default-logging
    restart: unless-stopped
    mem_limit: 4g
    environment:
      LLM_BINDING: openai
      LLM_BINDING_HOST: ${LIGHTRAG_LLM_BASE_URL:-https://api.siliconflow.cn/v1}
      LLM_BASE_URL: ${LIGHTRAG_LLM_BASE_URL:-https://api.siliconflow.cn/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      OPENAI_API_KEY: ${LLM_API_KEY:-}
      OPENAI_BASE_URL: ${LIGHTRAG_LLM_BASE_URL:-https://api.siliconflow.cn/v1}
      LLM_MODEL: ${LIGHTRAG_LLM_MODEL:-Qwen/Qwen3.5-4B}
      MAX_ASYNC_LLM: ${LIGHTRAG_MAX_ASYNC_LLM:-2}
      MAX_ASYNC_EMBEDDING: ${LIGHTRAG_MAX_ASYNC_EMBEDDING:-4}
      MAX_PARALLEL_INSERT: ${LIGHTRAG_MAX_PARALLEL_INSERT:-1}
      LLM_MAX_RETRIES: 8
      LLM_TIMEOUT: ${LIGHTRAG_LLM_TIMEOUT:-900}
      EMBEDDING_TIMEOUT: ${LIGHTRAG_EMBEDDING_TIMEOUT:-60}
      OPENAI_LLM_MAX_TOKENS: ${LIGHTRAG_LLM_MAX_OUTPUT_TOKENS:-9000}
      MAX_TOKENS: 2000
      EMBEDDING_BINDING: openai
      EMBEDDING_BINDING_HOST: ${LIGHTRAG_LLM_BASE_URL:-https://api.siliconflow.cn/v1}
      EMBEDDING_BASE_URL: ${LIGHTRAG_LLM_BASE_URL:-https://api.siliconflow.cn/v1}
      EMBEDDING_API_KEY: ${LLM_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-m3}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1024}
      EMBEDDING_MAX_TOKEN_SIZE: ${EMBEDDING_MAX_TOKEN_SIZE:-8192}
      PORT: 9621
      WORKING_DIR: /app/data/rag_storage
      LIGHTRAG_API_PREFIX: /lightrag-webui
      LIGHTRAG_API_KEY: ""
      AUTH_ACCOUNTS: ""
      WHITELIST_PATHS: /health
      TOKEN_SECRET: ${LIGHTRAG_TOKEN_SECRET:-}
      TOKEN_EXPIRE_HOURS: ${LIGHTRAG_TOKEN_EXPIRE_HOURS:-48}
    volumes:
      - traceqa-lightrag-data:/app/data
    ports:
      - "6119:9621"
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:9621/health', timeout=5)" ]
      interval: 15s
      timeout: 8s
      retries: 10
      start_period: 30s

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: traceqa-minio
    labels: { logging: promtail }
    logging: *default-logging
    restart: unless-stopped
    mem_limit: 1g
    command: [ "server", "/data", "--console-address", ":9001" ]
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
      TZ: Asia/Shanghai
    volumes:
      - traceqa-minio-data:/data
    ports:
      - "6116:9000"   # 对外公开：头像直链
      - "9001:9001"   # 控制台（防火墙阻断）
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 15s
      timeout: 5s
      retries: 10

  # ===================== 微服务 =====================
  gateway:
    image: ${GATEWAY_IMAGE:-ghcr.io/max43g/traceqa/gateway:latest}
    build:
      context: .
      dockerfile: docker/gateway.Dockerfile
    container_name: traceqa-gateway
    labels: { logging: promtail }
    logging: *default-logging
    restart: unless-stopped
    mem_limit: 768m
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
      NACOS_SERVER_ADDR: nacos:8848
      REDIS_HOST: redis
      OTEL_SERVICE_NAME: traceqa-gateway
      OTEL_TRACES_EXPORTER: otlp
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      TZ: Asia/Shanghai
    ports:
      - "6114:8080"
    depends_on:
      nacos:
        condition: service_healthy
      redis:
        condition: service_healthy

  user-service:
    image: ${USER_SERVICE_IMAGE:-ghcr.io/max43g/traceqa/user-service:latest}
    build:
      context: .
      dockerfile: docker/user-service.Dockerfile
    container_name: traceqa-user-service
    labels: { logging: promtail }
    logging: *default-logging
    restart: unless-stopped
    mem_limit: 768m
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8081
      NACOS_SERVER_ADDR: nacos:8848
      REDIS_HOST: redis
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE_USER: traceqa_user
      MYSQL_USER: ${MYSQL_USER:-traceqa}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-traceqa123}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-}
      DEFAULT_USER_PASSWORD: ${DEFAULT_USER_PASSWORD:-}
      OTEL_SERVICE_NAME: traceqa-user-service
      OTEL_TRACES_EXPORTER: otlp
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      TZ: Asia/Shanghai
    ports:
      - "6122:8081"
    depends_on:
      mysql:
        condition: service_healthy
      nacos:
        condition: service_healthy

  file-service:
    image: ${FILE_SERVICE_IMAGE:-ghcr.io/max43g/traceqa/file-service:latest}
    build:
      context: .
      dockerfile: docker/file-service.Dockerfile
    container_name: traceqa-file-service
    labels: { logging: promtail }
    logging: *default-logging
    restart: unless-stopped
    mem_limit: 512m
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8083
      NACOS_SERVER_ADDR: nacos:8848
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-traceqa}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-https://121.41.72.189:6116}
      OTEL_SERVICE_NAME: traceqa-file-service
      OTEL_TRACES_EXPORTER: otlp
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      TZ: Asia/Shanghai
    ports:
      - "6123:8083"
    depends_on:
      nacos:
        condition: service_healthy
      minio:
        condition: service_healthy

  kb-service:
    image: ${KB_SERVICE_IMAGE:-ghcr.io/max43g/traceqa/kb-service:latest}
    build:
      context: .
      dockerfile: docker/kb-service.Dockerfile
    container_name: traceqa-kb-service
    labels: { logging: promtail }
    logging: *default-logging
    restart: unless-stopped
    mem_limit: 1g
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8084
      NACOS_SERVER_ADDR: nacos:8848
      REDIS_HOST: redis
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE_KB: traceqa_kb
      MYSQL_USER: ${MYSQL_USER:-traceqa}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-traceqa123}
      LIGHTRAG_BASE_URL: http://lightrag:9621
      LIGHTRAG_API_KEY: ""
      APP_STORAGE_ROOT: /app/data/files
      OTEL_SERVICE_NAME: traceqa-kb-service
      OTEL_TRACES_EXPORTER: otlp
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      TZ: Asia/Shanghai
    volumes:
      - traceqa-kb-data:/app/data
    ports:
      - "6124:8084"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
      lightrag:
        condition: service_healthy

  qa-service:
    image: ${QA_SERVICE_IMAGE:-ghcr.io/max43g/traceqa/qa-service:latest}
    build:
      context: .
      dockerfile: docker/qa-service.Dockerfile
    container_name: traceqa-qa-service
    labels: { logging: promtail }
    logging: *default-logging
    restart: unless-stopped
    mem_limit: 1g
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8085
      NACOS_SERVER_ADDR: nacos:8848
      REDIS_HOST: redis
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE_QA: traceqa_qa
      MYSQL_USER: ${MYSQL_USER:-traceqa}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-traceqa123}
      LIGHTRAG_BASE_URL: http://lightrag:9621
      LIGHTRAG_API_KEY: ""
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.siliconflow.cn}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-THUDM/GLM-4-9B-0414}
      OTEL_SERVICE_NAME: traceqa-qa-service
      OTEL_TRACES_EXPORTER: otlp
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      TZ: Asia/Shanghai
    ports:
      - "6125:8085"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
      lightrag:
        condition: service_healthy

  admin-service:
    image: ${ADMIN_SERVICE_IMAGE:-ghcr.io/max43g/traceqa/admin-service:latest}
    build:
      context: .
      dockerfile: docker/admin-service.Dockerfile
    container_name: traceqa-admin-service
    labels: { logging: promtail }
    logging: *default-logging
    restart: unless-stopped
    mem_limit: 512m
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8086
      NACOS_SERVER_ADDR: nacos:8848
      REDIS_HOST: redis
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE_ADMIN: traceqa_admin
      MYSQL_USER: ${MYSQL_USER:-traceqa}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-traceqa123}
      LIGHTRAG_BASE_URL: http://lightrag:9621
      LIGHTRAG_API_KEY: ""
      APP_OBSERVABILITY_SCRAPE_TOKEN: ${OBSERVABILITY_SCRAPE_TOKEN:-traceqa-prometheus-scrape-change-me}
      APP_COOKIE_SECURE: ${APP_COOKIE_SECURE:-false}
      OBSERVABILITY_GRAFANA_BASE_URL: http://grafana:3000
      OBSERVABILITY_PROMETHEUS_BASE_URL: http://prometheus:9090
      OTEL_SERVICE_NAME: traceqa-admin-service
      OTEL_TRACES_EXPORTER: otlp
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      TZ: Asia/Shanghai
    ports:
      - "6126:8086"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      mysql:
        condition: service_healthy
      nacos:
        condition: service_healthy

  # ===================== 前端 + 网关入口 =====================
  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/max43g/traceqa/frontend:latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        API_PROXY_TARGET: http://gateway:8080
    container_name: traceqa-frontend
    labels: { logging: promtail }
    logging: *default-logging
    restart: unless-stopped
    depends_on:
      - gateway
    ports:
      - "6130:3000"

  caddy:
    image: caddy:2.11.4-alpine
    container_name: traceqa-caddy
    labels: { logging: promtail }
    logging: *default-logging
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ./frontend/Caddyfile:/etc/caddy/Caddyfile:ro
      - traceqa-caddy-data:/data
      - traceqa-caddy-config:/config
      - /root/caddy-certs:/etc/ssl/caddy-certs:ro
      - /var/www/acme-challenge:/var/www/acme-challenge:ro
    ports:
      - "80:80"
      - "443:443"
      - "6115:443"
    depends_on:
      - frontend
      - minio

  # ===================== 可观测性 =====================
  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: traceqa-prometheus
    labels: { logging: promtail }
    logging: *default-logging
    restart: unless-stopped
    mem_limit: 768m
    entrypoint:
      - /bin/sh
      - -c
      - |
        sed "s/__SCRAPE_TOKEN__/$${OBSERVABILITY_SCRAPE_TOKEN}/g" /etc/prometheus/prometheus.yml > /tmp/prometheus.yml
        exec prometheus --config.file=/tmp/prometheus.yml \
          --web.external-url=/prometheus \
          --web.route-prefix=/prometheus
    environment:
      OBSERVABILITY_SCRAPE_TOKEN: ${OBSERVABILITY_SCRAPE_TOKEN:-traceqa-prometheus-scrape-change-me}
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - admin-service
    ports:
      - "6127:9090"

  grafana:
    image: grafana/grafana:13.1.4
    container_name: traceqa-grafana
    labels: { logging: promtail }
    logging: *default-logging
    restart: unless-stopped
    mem_limit: 768m
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin123}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_DISABLE_SIGNOUT_MENU: "true"
      GF_AUTH_BASIC_ENABLED: "false"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SERVER_ROOT_URL: /grafana
      GF_SERVER_ENABLE_GZIP: "true"
      GF_LIVE_ENABLED: "false"
      TZ: Asia/Shanghai
    volumes:
      - ./docker/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./docker/grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./docker/grafana/dashboard-traceqa.json:/var/lib/grafana/dashboards/traceqa.json:ro
      - traceqa-grafana-data:/var/lib/grafana
    ports:
      - "6128:3000"
    depends_on:
      - prometheus

  loki:
    image: grafana/loki:3.6.16
    container_name: traceqa-loki
    labels: { logging: promtail }
    logging: *default-logging
    restart: unless-stopped
    mem_limit: 768m
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./docker/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - traceqa-loki-data:/loki

  # Tempo：追踪后端（OTLP 接收，供 Traces to Logs）
  tempo:
    image: grafana/tempo:2.6.1
    container_name: traceqa-tempo
    labels: { logging: promtail }
    logging: *default-logging
    restart: unless-stopped
    mem_limit: 768m
    command: [ "-config.file=/etc/tempo.yaml" ]
    volumes:
      - ./docker/tempo.yaml:/etc/tempo.yaml:ro
      - traceqa-tempo-data:/var/tempo
    ports:
      - "6129:3200"   # Tempo UI / HTTP
      - "4317:4317"   # OTLP gRPC（微服务上报，内网）
      - "4318:4318"   # OTLP HTTP（微服务上报，内网）

  promtail:
    image: grafana/promtail:3.6.11
    container_name: traceqa-promtail
    labels: { logging: promtail }
    logging: *default-logging
    restart: unless-stopped
    mem_limit: 256m
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./docker/promtail-config.yaml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    ports:
      - "6131:9080"
      - "6132:3100"

volumes:
  traceqa-mysql-data:
  traceqa-redis-data:
  traceqa-lightrag-data:
  traceqa-minio-data:
  traceqa-kb-data:
  traceqa-grafana-data:
  traceqa-caddy-data:
  traceqa-caddy-config:
  traceqa-loki-data:
  traceqa-tempo-data:
  acme-webroot: