# ============================================================
# 溯知 / TraceQA 微服务一键部署编排
# 服务：postgresql + neo4j + redis + nacos + lightrag + minio
#      + gateway + user/file/kb/qa/admin 微服务 + frontend + caddy + prometheus + grafana
#
# 对外仅开放端口：80 / 443 / 6115（Caddy/前端 HTTPS）、6116（MinIO 头像直链）
# 其余微服务端口在容器内开放，供服务间通信；服务器防火墙需阻断非以上四端口的外网访问
#
# 使用：cp .env.example .env && docker compose up -d --build
# ============================================================
name: traceqa

# 默认日志轮转
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "5m"
    max-file: "3"

services:
  # ===================== 基础设施 =====================
  postgresql:
    image: postgres:18.6
    container_name: traceqa-postgresql
    labels: { logging: promtail }
    logging: *default-logging
    restart: unless-stopped
    mem_limit: 1g
    environment:
      POSTGRES_PASSWORD: ${PG_ROOT_PASSWORD:-root123456}
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: Asia/Shanghai
    command:
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - max_connections=200
      - -c
      - timezone=Asia/Shanghai
    volumes:
      - ./db:/docker-entrypoint-initdb.d:ro
      - traceqa-pg-data:/var/lib/postgresql/data
    ports:
      - "6118:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:5.26.30-community
    container_name: traceqa-neo4j
    labels: { logging: promtail }
    logging: *default-logging
    restart: unless-stopped
    mem_limit: 2g
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/traceqa-neo4j-2026}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1g
      NEO4J_server_memory_pagecache_size: 512m
      TZ: Asia/Shanghai
    volumes:
      - traceqa-neo4j-data:/data
    ports:
      - "6133:7474"   # HTTP（Neo4j Browser）
      - "6134:7687"   # Bolt
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 8s
      retries: 10
      start_period: 30s

  redis:
    image: redis:8.8.2
    container_name: traceqa-redis
    labels: { logging: promtail }
    logging: *default-logging
    restart: unless-stopped
    mem_limit: 512m
    command: [ "redis-server", "--appendonly", "yes", "--save", "60 1", "--appendfsync", "everysec" ]
    volumes:
      - traceqa-redis-data:/data
    ports:
      - "6117:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Nacos：服务注册与发现（含配置中心）
  nacos:
    image: nacos/nacos-server:v2.5.1
    container_name: traceqa-nacos
    labels: { logging: promtail }
    logging: *default-logging
    restart: unless-stopped
    mem_limit: 1g
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
      JVM_XMS: 256m
      JVM_XMX: 512m
      JVM_XMN: 128m
      TZ: Asia/Shanghai
    ports:
      - "6120:8848"
      - "6121:9848"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://127.0.0.1:8848/nacos/v1/console/health/readiness" ]
      interval: 15s
      timeout: 5s
      retries: 10

  lightrag:
    image: ghcr.io/hkuds/lightrag:latest
    container_name: traceqa-lightrag
    labels: { logging: promtail }
    logging: *default-logging
    restart: unless-stopped
    environment:
      LLM_BINDING: openai
      LLM_BINDING_HOST: ${LIGHTRAG_LLM_BASE_URL:-https://api.siliconflow.cn/v1}
      LLM_BASE_URL: ${LIGHTRAG_LLM_BASE_URL:-https://api.siliconflow.cn/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      OPENAI_API_KEY: ${LLM_API_KEY:-}
      OPENAI_BASE_URL: ${LIGHTRAG_LLM_BASE_URL:-https://api.siliconflow.cn/v1}
      LLM_MODEL: ${LIGHTRAG_LLM_MODEL:-Qwen/Qwen3.5-4B}
      MAX_ASYNC_LLM: ${LIGHTRAG_MAX_ASYNC_LLM:-2}
      MAX_ASYNC_EMBEDDING: ${LIGHTRAG_MAX_ASYNC_EMBEDDING:-4}
      MAX_PARALLEL_INSERT: ${LIGHTRAG_MAX_PARALLEL_INSERT:-1}
      LLM_MAX_RETRIES: 8
      LLM_TIMEOUT: ${LIGHTRAG_LLM_TIMEOUT:-900}
      EMBEDDING_TIMEOUT: ${LIGHTRAG_EMBEDDING_TIMEOUT:-60}
      OPENAI_LLM_MAX_TOKENS: ${LIGHTRAG_LLM_MAX_OUTPUT_TOKENS:-9000}
      MAX_TOKENS: 2000
      EMBEDDING_BINDING: openai
      EMBEDDING_BINDING_HOST: ${LIGHTRAG_LLM_BASE_URL:-https://api.siliconflow.cn/v1}
      EMBEDDING_BASE_URL: ${LIGHTRAG_LLM_BASE_URL:-https://api.siliconflow.cn/v1}
      EMBEDDING_API_KEY: ${LLM_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-m3}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1024}
      EMBEDDING_MAX_TOKEN_SIZE: ${EMBEDDING_MAX_TOKEN_SIZE:-8192}
      PORT: 9621
      WORKING_DIR: /app/data/rag_storage
      LIGHTRAG_API_PREFIX: /lightrag-webui
      LIGHTRAG_API_KEY: ""
      AUTH_ACCOUNTS: ""
      WHITELIST_PATHS: /health
      TOKEN_SECRET: ${LIGHTRAG_TOKEN_SECRET:-}
      TOKEN_EXPIRE_HOURS: ${LIGHTRAG_TOKEN_EXPIRE_HOURS:-48}
      # ---- 图谱存储：Neo4j ----
      LIGHTRAG_STORAGE_GRAPH: Neo4jStorage
      LIGHTRAG_STORAGE_GRAPH_URL: bolt://neo4j:7687
      LIGHTRAG_STORAGE_GRAPH_USER: neo4j
      LIGHTRAG_STORAGE_GRAPH_PASSWORD: ${NEO4J_AUTH:-neo4j/traceqa-neo4j-2026}
      # ---- 向量存储：PostgreSQL (pgvector) ----
      LIGHTRAG_STORAGE_VECTOR: PGVectorStorage
      LIGHTRAG_STORAGE_VECTOR_HOST: postgresql
      LIGHTRAG_STORAGE_VECTOR_PORT: 5432
      LIGHTRAG_STORAGE_VECTOR_USER: ${PG_USER:-traceqa}
      LIGHTRAG_STORAGE_VECTOR_PASSWORD: ${PG_PASSWORD:-traceqa123}
      LIGHTRAG_STORAGE_VECTOR_DATABASE: traceqa_lightrag
    volumes:
      - traceqa-lightrag-data:/app/data
    ports:
      - "6119:9621"
    depends_on:
      neo4j:
        condition: service_healthy
      postgresql:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:9621/health', timeout=5)" ]
      interval: 15s
      timeout: 8s
      retries: 10
      start_period: 30s

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: traceqa-minio
    labels: { logging: promtail }
    logging: *default-logging
    restart: unless-stopped
    mem_limit: 1g
    command: [ "server", "/data", "--console-address", ":9001" ]
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
      TZ: Asia/Shanghai
    volumes:
      - traceqa-minio-data:/data
    ports:
      - "6116:9000"   # 对外公开：头像直链
      - "9001:9001"   # 控制台（防火墙阻断）
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 15s
      timeout: 5s
      retries: 10

  elasticsearch:
    image: elasticsearch:9.5.3
    container_name: traceqa-elasticsearch
    labels: { logging: promtail }
    logging: *default-logging
    restart: unless-stopped
    mem_limit: 1g
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - cluster.name=traceqa-es
      - bootstrap.memory_lock=true
      - TZ=Asia/Shanghai
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - traceqa-es-data:/usr/share/elasticsearch/data
    ports:
      - "6135:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 8s
      retries: 10
      start_period: 30s

  # ===================== 微服务 =====================
  gateway:
    image: ${GATEWAY_IMAGE:-ghcr.io/max43g/traceqa/gateway:latest}
    build:
      context: .
      dockerfile: docker/gateway.Dockerfile
    container_name: traceqa-gateway
    labels: { logging: promtail }
    logging: *default-logging
    restart: unless-stopped
    mem_limit: 768m
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
      NACOS_SERVER_ADDR: nacos:8848
      REDIS_HOST: redis
      OTEL_SERVICE_NAME: traceqa-gateway
      OTEL_TRACES_EXPORTER: otlp
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      TZ: Asia/Shanghai
    ports:
      - "6114:8080"
    depends_on:
      nacos:
        condition: service_healthy
      redis:
        condition: service_healthy

  user-service:
    image: ${USER_SERVICE_IMAGE:-ghcr.io/max43g/traceqa/user-service:latest}
    build:
      context: .
      dockerfile: docker/user-service.Dockerfile
    container_name: traceqa-user-service
    labels: { logging: promtail }
    logging: *default-logging
    restart: unless-stopped
    mem_limit: 768m
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8081
      NACOS_SERVER_ADDR: nacos:8848
      REDIS_HOST: redis
      PG_HOST: postgresql
      PG_PORT: 5432
      PG_DATABASE_USER: traceqa_user
      PG_USER: ${PG_USER:-traceqa}
      PG_PASSWORD: ${PG_PASSWORD:-traceqa123}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-}
      DEFAULT_USER_PASSWORD: ${DEFAULT_USER_PASSWORD:-}
      # 已有表但无 Flyway 历史表时将其作为基线，避免启动失败
      SPRING_FLYWAY_BASELINEONMIGRATE: "true"
      OTEL_SERVICE_NAME: traceqa-user-service
      OTEL_TRACES_EXPORTER: otlp
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      TZ: Asia/Shanghai
    ports:
      - "6122:8081"
    depends_on:
      postgresql:
        condition: service_healthy
      nacos:
        condition: service_healthy

  file-service:
    image: ${FILE_SERVICE_IMAGE:-ghcr.io/max43g/traceqa/file-service:latest}
    build:
      context: .
      dockerfile: docker/file-service.Dockerfile
    container_name: traceqa-file-service
    labels: { logging: promtail }
    logging: *default-logging
    restart: unless-stopped
    mem_limit: 512m
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8083
      NACOS_SERVER_ADDR: nacos:8848
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-traceqa}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-https://121.41.72.189:6116}
      OTEL_SERVICE_NAME: traceqa-file-service
      OTEL_TRACES_EXPORTER: otlp
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      TZ: Asia/Shanghai
    ports:
      - "6123:8083"
    depends_on:
      nacos:
        condition: service_healthy
      minio:
        condition: service_healthy

  kb-service:
    image: ${KB_SERVICE_IMAGE:-ghcr.io/max43g/traceqa/kb-service:latest}
    build:
      context: .
      dockerfile: docker/kb-service.Dockerfile
    container_name: traceqa-kb-service
    labels: { logging: promtail }
    logging: *default-logging
    restart: unless-stopped
    mem_limit: 1g
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8084
      NACOS_SERVER_ADDR: nacos:8848
      REDIS_HOST: redis
      PG_HOST: postgresql
      PG_PORT: 5432
      PG_DATABASE_KB: traceqa_kb
      PG_USER: ${PG_USER:-traceqa}
      PG_PASSWORD: ${PG_PASSWORD:-traceqa123}
      LIGHTRAG_BASE_URL: http://lightrag:9621
      LIGHTRAG_API_KEY: ""
      APP_STORAGE_ROOT: /app/data/files
      ES_HOST: elasticsearch
      ES_PORT: 9200
      # 已有表但无 Flyway 历史表时将其作为基线，避免启动失败
      SPRING_FLYWAY_BASELINEONMIGRATE: "true"
      OTEL_SERVICE_NAME: traceqa-kb-service
      OTEL_TRACES_EXPORTER: otlp
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      TZ: Asia/Shanghai
    volumes:
      - traceqa-kb-data:/app/data
    ports:
      - "6124:8084"
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
      lightrag:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

  qa-service:
    image: ${QA_SERVICE_IMAGE:-ghcr.io/max43g/traceqa/qa-service:latest}
    build:
      context: .
      dockerfile: docker/qa-service.Dockerfile
    container_name: traceqa-qa-service
    labels: { logging: promtail }
    logging: *default-logging
    restart: unless-stopped
    mem_limit: 1g
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8085
      NACOS_SERVER_ADDR: nacos:8848
      REDIS_HOST: redis
      PG_HOST: postgresql
      PG_PORT: 5432
      PG_DATABASE_QA: traceqa_qa
      PG_USER: ${PG_USER:-traceqa}
      PG_PASSWORD: ${PG_PASSWORD:-traceqa123}
      LIGHTRAG_BASE_URL: http://lightrag:9621
      LIGHTRAG_API_KEY: ""
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.siliconflow.cn}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-THUDM/GLM-4-9B-0414}
      ES_HOST: elasticsearch
      ES_PORT: 9200
      # 检索加速开关：默认关闭「二次检索补全 / 精排」以提速，需要时置 true 打开
      APP_RETRIEVAL_ENABLE_REREAD: ${RETRIEVAL_ENABLE_REREAD:-true}
      APP_RETRIEVAL_ENABLE_RERANK: ${RETRIEVAL_ENABLE_RERANK:-true}
      # 外部语义重排
      APP_RERANK_ENABLED: ${RERANK_ENABLED:-true}
      APP_RERANK_BASE_URL: ${RERANK_BASE_URL:-https://api.siliconflow.cn}
      APP_RERANK_API_KEY: ${RERANK_API_KEY:-}
      APP_RERANK_MODEL: ${RERANK_MODEL:-BAAI/bge-reranker-v2-m3}
      # 已有表但无 Flyway 历史表时将其作为基线，避免启动失败
      SPRING_FLYWAY_BASELINEONMIGRATE: "true"
      OTEL_SERVICE_NAME: traceqa-qa-service
      OTEL_TRACES_EXPORTER: otlp
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      TZ: Asia/Shanghai
    ports:
      - "6125:8085"
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
      lightrag:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

  admin-service:
    image: ${ADMIN_SERVICE_IMAGE:-ghcr.io/max43g/traceqa/admin-service:latest}
    build:
      context: .
      dockerfile: docker/admin-service.Dockerfile
    container_name: traceqa-admin-service
    labels: { logging: promtail }
    logging: *default-logging
    restart: unless-stopped
    mem_limit: 512m
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8086
      NACOS_SERVER_ADDR: nacos:8848
      REDIS_HOST: redis
      PG_HOST: postgresql
      PG_PORT: 5432
      PG_DATABASE_ADMIN: traceqa_admin
      PG_USER: ${PG_USER:-traceqa}
      PG_PASSWORD: ${PG_PASSWORD:-traceqa123}
      LIGHTRAG_BASE_URL: http://lightrag:9621
      LIGHTRAG_API_KEY: ""
      APP_OBSERVABILITY_SCRAPE_TOKEN: ${OBSERVABILITY_SCRAPE_TOKEN:-traceqa-prometheus-scrape-change-me}
      APP_COOKIE_SECURE: ${APP_COOKIE_SECURE:-false}
      # 已有表但无 Flyway 历史表时将其作为基线，避免启动失败
      SPRING_FLYWAY_BASELINEONMIGRATE: "true"
      OBSERVABILITY_GRAFANA_BASE_URL: http://grafana:3000
      OBSERVABILITY_PROMETHEUS_BASE_URL: http://prometheus:9090
      OTEL_SERVICE_NAME: traceqa-admin-service
      OTEL_TRACES_EXPORTER: otlp
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      DBX_BASE_URL: http://dbx:4224
      TZ: Asia/Shanghai
    ports:
      - "6126:8086"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgresql:
        condition: service_healthy
      nacos:
        condition: service_healthy
      dbx:
        condition: service_started

  # ===================== 工具服务 =====================
  dbx:
    image: t8y2/dbx:0.6.6
    container_name: traceqa-dbx
    labels: { logging: promtail }
    logging: *default-logging
    restart: unless-stopped
    mem_limit: 512m
    environment:
      DBX_PUBLIC_BASE_PATH: /dbx
      DBX_DISABLE_PASSWORD: "1"
      TZ: Asia/Shanghai
    volumes:
      - traceqa-dbx-data:/app/data
    ports:
      - "4224:4224"

  # ===================== 前端 + 网关入口 =====================
  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/max43g/traceqa/frontend:latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        API_PROXY_TARGET: http://gateway:8080
    container_name: traceqa-frontend
    labels: { logging: promtail }
    logging: *default-logging
    restart: unless-stopped
    depends_on:
      - gateway
    ports:
      - "6130:3000"

  caddy:
    image: caddy:2.11.4-alpine
    container_name: traceqa-caddy
    labels: { logging: promtail }
    logging: *default-logging
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ./frontend/Caddyfile:/etc/caddy/Caddyfile
      - traceqa-caddy-data:/data
      - traceqa-caddy-config:/config
      - /root/caddy-certs:/etc/ssl/caddy-certs
      - /var/www/acme-challenge:/var/www/acme-challenge
    ports:
      - "80:80"
      - "443:443"
      - "6115:443"
    depends_on:
      - frontend
      - minio

  # ===================== 可观测性 =====================
  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: traceqa-prometheus
    labels: { logging: promtail }
    logging: *default-logging
    restart: unless-stopped
    mem_limit: 768m
    entrypoint:
      - /bin/sh
      - -c
      - |
        sed "s/__SCRAPE_TOKEN__/$${OBSERVABILITY_SCRAPE_TOKEN}/g" /etc/prometheus/prometheus.yml > /tmp/prometheus.yml
        exec prometheus --config.file=/tmp/prometheus.yml \
          --web.external-url=/prometheus \
          --web.route-prefix=/prometheus
    environment:
      OBSERVABILITY_SCRAPE_TOKEN: ${OBSERVABILITY_SCRAPE_TOKEN:-traceqa-prometheus-scrape-change-me}
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - admin-service
    ports:
      - "6127:9090"

  grafana:
    image: grafana/grafana:13.1.4
    container_name: traceqa-grafana
    labels: { logging: promtail }
    logging: *default-logging
    restart: unless-stopped
    mem_limit: 768m
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin123}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_DISABLE_SIGNOUT_MENU: "true"
      GF_AUTH_BASIC_ENABLED: "false"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SERVER_ROOT_URL: /grafana
      GF_SERVER_ENABLE_GZIP: "true"
      GF_LIVE_ENABLED: "false"
      TZ: Asia/Shanghai
    volumes:
      - ./docker/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./docker/grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./docker/grafana/dashboard-traceqa.json:/var/lib/grafana/dashboards/traceqa.json:ro
      - ./docker/grafana/dashboard-rag.json:/var/lib/grafana/dashboards/traceqa-rag.json:ro
      - traceqa-grafana-data:/var/lib/grafana
    ports:
      - "6128:3000"
    depends_on:
      - prometheus

  loki:
    image: grafana/loki:3.6.16
    container_name: traceqa-loki
    labels: { logging: promtail }
    logging: *default-logging
    restart: unless-stopped
    mem_limit: 768m
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./docker/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - traceqa-loki-data:/loki

  # Tempo：追踪后端（OTLP 接收，供 Traces to Logs）
  tempo:
    image: grafana/tempo:2.6.1
    container_name: traceqa-tempo
    labels: { logging: promtail }
    logging: *default-logging
    restart: unless-stopped
    mem_limit: 768m
    command: [ "-config.file=/etc/tempo.yaml" ]
    volumes:
      - ./docker/tempo.yaml:/etc/tempo.yaml:ro
      - traceqa-tempo-data:/var/tempo
    ports:
      - "6129:3200"   # Tempo UI / HTTP
      - "4317:4317"   # OTLP gRPC（微服务上报，内网）
      - "4318:4318"   # OTLP HTTP（微服务上报，内网）

  promtail:
    image: grafana/promtail:3.6.11
    container_name: traceqa-promtail
    labels: { logging: promtail }
    logging: *default-logging
    restart: unless-stopped
    mem_limit: 256m
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./docker/promtail-config.yaml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    ports:
      - "6131:9080"
      - "6132:3100"

volumes:
  traceqa-pg-data:
  traceqa-neo4j-data:
  traceqa-redis-data:
  traceqa-lightrag-data:
  traceqa-minio-data:
  traceqa-es-data:
  traceqa-kb-data:
  traceqa-dbx-data:
  traceqa-grafana-data:
  traceqa-caddy-data:
  traceqa-caddy-config:
  traceqa-loki-data:
  traceqa-tempo-data:
  acme-webroot:
