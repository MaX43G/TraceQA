# ============================================================
# 溯知 / TraceQA 一键部署编排
# 服务：mysql + redis + lightrag(知识图谱引擎) + backend(Spring Boot) + frontend(Nuxt SSR)
# 使用：cp .env.example .env && docker compose up -d --build
# ============================================================
name: traceqa

services:
  # 数据库（单库，极简架构）
  mysql:
    image: mysql:latest
    container_name: traceqa-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-traceqa}
      MYSQL_USER: ${MYSQL_USER:-traceqa}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-traceqa123}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      # 首次启动自动建表
      - ./src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - traceqa-mysql-data:/var/lib/mysql
    ports:
      # 映射到宿主机 6118，供外部访问
      - "6118:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root123456}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Redis：查询/Agent 决策缓存 + 文档处理异步队列
  # 轻量配置：内存上限 256MB、不落盘（缓存可重建），适配小内存服务器
  redis:
    image: redis:latest
    container_name: traceqa-redis
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--appendonly", "no", "--save", ""]
    volumes:
      - traceqa-redis-data:/data
    ports:
      # 映射到宿主机 6117，供外部访问
      - "6117:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # LightRAG 官方 Server（知识图谱 + 向量引擎）
  lightrag:
    image: ghcr.io/hkuds/lightrag:latest
    container_name: traceqa-lightrag
    restart: unless-stopped
    environment:
      # LLM（OpenAI 兼容，硅基流动；LightRAG 需带 /v1，与后端 Spring AI 的 base-url 分离）
      LLM_BINDING: openai
      LLM_BINDING_HOST: ${LIGHTRAG_LLM_BASE_URL:-https://api.siliconflow.cn/v1}
      LLM_BASE_URL: ${LIGHTRAG_LLM_BASE_URL:-https://api.siliconflow.cn/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      # LightRAG openai binding 同时读取 OPENAI_API_KEY / OPENAI_BASE_URL
      OPENAI_API_KEY: ${LLM_API_KEY:-}
      OPENAI_BASE_URL: ${LIGHTRAG_LLM_BASE_URL:-https://api.siliconflow.cn/v1}
      LLM_MODEL: ${LIGHTRAG_LLM_MODEL:-Qwen/Qwen3.5-4B}
      MAX_ASYNC_LLM: ${LIGHTRAG_MAX_ASYNC_LLM:-2}
      MAX_ASYNC_EMBEDDING: ${LIGHTRAG_MAX_ASYNC_EMBEDDING:-4}
      # 单次抽取可并行提交的文档数（大文档多块时生效，避免瞬时打爆限流）
      MAX_PARALLEL_INSERT: ${LIGHTRAG_MAX_PARALLEL_INSERT:-1}
      LLM_MAX_RETRIES: 8
      # LLM 请求超时（秒）：硅基流动免费额度的 4B 小模型生成较慢，
      # 默认 480s 太紧容易在抽取中途被判定超时导致整篇失败，放宽到 900s
      LLM_TIMEOUT: ${LIGHTRAG_LLM_TIMEOUT:-900}
      # Embedding 请求超时（秒）：bge-m3 一般 1-3s 返回，60s 足够
      EMBEDDING_TIMEOUT: ${LIGHTRAG_EMBEDDING_TIMEOUT:-60}
      # 限制实体/关系抽取的单次 LLM 输出上限（防止部分 LLM 无限输出触发超时），
      # 经验公式：LLM_TIMEOUT * 输出速度 ≈ 900s * 50 tokens/s
      OPENAI_LLM_MAX_TOKENS: ${LIGHTRAG_LLM_MAX_OUTPUT_TOKENS:-9000}
      MAX_TOKENS: 2000
      # Embedding（同 OpenAI 兼容端点）
      EMBEDDING_BINDING: openai
      EMBEDDING_BINDING_HOST: ${LIGHTRAG_LLM_BASE_URL:-https://api.siliconflow.cn/v1}
      EMBEDDING_BASE_URL: ${LIGHTRAG_LLM_BASE_URL:-https://api.siliconflow.cn/v1}
      EMBEDDING_API_KEY: ${LLM_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-m3}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1024}
      EMBEDDING_MAX_TOKEN_SIZE: ${EMBEDDING_MAX_TOKEN_SIZE:-8192}
      # 服务
      PORT: 9621
      WORKING_DIR: /app/data/rag_storage
      # 反向代理前缀：WebUI 与所有 API 都挂在该前缀下，仅经后端 /lightrag-webui/** 代理访问
      LIGHTRAG_API_PREFIX: /lightrag-webui
      # 鉴权由后端反向代理（管理员 Cookie）统一承担，故不再为 LightRAG 配置 API Key 与 WebUI 账号，
      # LightRAG 仅限 Docker 内网访问，不对外暴露端口
      LIGHTRAG_API_KEY: ""
      AUTH_ACCOUNTS: ""
      WHITELIST_PATHS: /health
      TOKEN_SECRET: ${LIGHTRAG_TOKEN_SECRET:-}
      TOKEN_EXPIRE_HOURS: ${LIGHTRAG_TOKEN_EXPIRE_HOURS:-48}
    volumes:
      - traceqa-lightrag-data:/app/data
    ports:
      - "6116:9621"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:9621/health', timeout=5)"]
      interval: 15s
      timeout: 8s
      retries: 10
      start_period: 30s

  # Spring Boot 后端
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: traceqa-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      REDIS_HOST: redis
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-traceqa}
      MYSQL_USER: ${MYSQL_USER:-traceqa}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-traceqa123}
      LIGHTRAG_BASE_URL: http://lightrag:9621
      LIGHTRAG_API_KEY: ""
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.siliconflow.cn}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-THUDM/GLM-4-9B-0414}
      APP_JWT_SECRET: ${APP_JWT_SECRET:-traceqa-prod-secret-change-me-please-2026}
      APP_STORAGE_ROOT: /app/data/files
      APP_OBSERVABILITY_SCRAPE_TOKEN: ${OBSERVABILITY_SCRAPE_TOKEN:-traceqa-prometheus-scrape-change-me}
      TZ: Asia/Shanghai
    volumes:
      - traceqa-backend-data:/app/data
    ports:
      - "6114:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      lightrag:
        condition: service_healthy

  # Nuxt SSR 前端
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        API_PROXY_TARGET: http://backend:8080
    container_name: traceqa-frontend
    restart: unless-stopped
    ports:
      - "6115:3000"
    depends_on:
      - backend

  # Prometheus：抓取后端 /actuator/prometheus 指标，并挂载在 /prometheus 子路径下供代理访问
  prometheus:
    image: prom/prometheus:latest
    container_name: traceqa-prometheus
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -c
      - |
        sed "s/__SCRAPE_TOKEN__/$${OBSERVABILITY_SCRAPE_TOKEN}/g" /etc/prometheus/prometheus.yml > /tmp/prometheus.yml
        exec prometheus --config.file=/tmp/prometheus.yml \
          --web.external-url=/prometheus \
          --web.route-prefix=/prometheus
    environment:
      OBSERVABILITY_SCRAPE_TOKEN: ${OBSERVABILITY_SCRAPE_TOKEN:-traceqa-prometheus-scrape-change-me}
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - backend
    ports:
      # 对外暴露（请用防火墙限制来源）；管理端走 /prometheus/** 代理
      - "6112:9090"

  # Grafana：可观测性可视化大盘（管理员鉴权），挂载在 /grafana 子路径下供代理访问
  grafana:
    image: grafana/grafana:latest
    container_name: traceqa-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin123}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      # 免登录：项目已通过后端代理（管理员 Cookie）鉴权，Grafana 以匿名管理员身份进入
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_DISABLE_SIGNOUT_MENU: "true"
      GF_AUTH_BASIC_ENABLED: "false"
      # 子路径部署：使 Grafana 生成 /grafana/... 资源引用，经后端反向代理正常访问
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SERVER_ROOT_URL: /grafana
      GF_SERVER_ENABLE_GZIP: "true"
      TZ: Asia/Shanghai
    volumes:
      - ./docker/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./docker/grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./docker/grafana/dashboard-traceqa.json:/var/lib/grafana/dashboards/traceqa.json:ro
      - traceqa-grafana-data:/var/lib/grafana
    ports:
      # 对外暴露（请用防火墙限制来源）；管理端走 /grafana/** 代理
      - "6113:3000"
    depends_on:
      - prometheus

volumes:
  traceqa-mysql-data:
  traceqa-redis-data:
  traceqa-lightrag-data:
  traceqa-backend-data:
  traceqa-grafana-data:
