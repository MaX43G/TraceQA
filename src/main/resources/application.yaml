spring:
  application:
    name: TraceQA
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      # 客户端超时需大于队列消费者 XREAD BLOCK(5s)，避免阻塞读被判定超时
      timeout: 6s
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB
  # 表结构由 DBA/初始化脚本预先建立（本地已建表），应用启动不再执行 SQL 脚本
  sql:
    init:
      mode: never
  # OpenAI 兼容接口配置（接入任意 OpenAI 兼容的 LLM 服务）
  # 注意：api-key 属敏感信息，由各 profile 配置文件提供（dev/prod），禁止在本文件写入密钥
  ai:
    openai:
      base-url: ${LLM_BASE_URL:https://api.siliconflow.cn}
      api-key: ${LLM_API_KEY:}
      # 快速失败：超时 15s、不重试，保证熔断降级链路及时生效
      timeout: 30s
      max-retries: 1
      chat:
        timeout: 30s
        max-retries: 1
        options:
          model: ${LLM_MODEL:THUDM/GLM-4-9B-0414}
          temperature: 0.3

# sa-token 认证配置
sa-token:
  # token 从 Authorization: Bearer 头读取（兼容前端现有请求）
  token-name: Authorization
  token-prefix: Bearer
  token-style: uuid
  timeout: 86400
  active-timeout: -1
  # 单端登录：同一账号同时只允许一个用户在线（新登录顶掉旧会话）
  is-concurrent: false
  is-share: false
  is-log: false

# OpenAPI 规范（前端依据 /v3/api-docs 自动生成 API 客户端）
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# MyBatis-Plus 配置
mybatis-plus:
  global-config:
    banner: false
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# 应用自定义配置
app:
  # 本地文件存储根目录（初期不引入对象存储/Redis 等中间件）
  storage:
    root: ${APP_STORAGE_ROOT:./data/files}
  jwt:
    secret: ${APP_JWT_SECRET:traceqa-secret-key-please-change-in-prod-2026}
    expiration: ${APP_JWT_EXPIRATION:7200000}
  # LightRAG 官方 Server（核心图谱/向量引擎）
  lightrag:
    base-url: ${LIGHTRAG_BASE_URL:http://localhost:9621}
    api-key: ${LIGHTRAG_API_KEY:}
    top-k: ${LIGHTRAG_TOP_K:20}
    # 请求超时（毫秒）
    connect-timeout: 5000
    read-timeout: 120000
  # 熔断降级参数
  circuit-breaker:
    failure-threshold: 3
    open-millis: 30000
    half-open-max-calls: 1
  # 可观测性（Actuator / Prometheus 抓取）
  observability:
    scrape-token: ${APP_OBSERVABILITY_SCRAPE_TOKEN:}
    # 经后端反向代理访问的内网地址
    grafana-base-url: ${OBSERVABILITY_GRAFANA_BASE_URL:http://grafana:3000}
    prometheus-base-url: ${OBSERVABILITY_PROMETHEUS_BASE_URL:http://prometheus:9090}
  # 会话 Cookie 是否标记 Secure（HTTPS 部署建议开启）
  cookie-secure: ${APP_COOKIE_SECURE:false}
  # 语义重排
  rerank:
    enabled: ${APP_RERANK_ENABLED:false}
    base-url: ${APP_RERANK_BASE_URL:}
    api-key: ${APP_RERANK_API_KEY:}
    model: ${APP_RERANK_MODEL:BAAI/bge-reranker-v2-m3}
    path: ${APP_RERANK_PATH:/rerank}
  # 可用模型列表（模型选择功能；默认模型名称取自 spring.ai.openai 配置）
  # 服务端模型共享硅基流动的 API Key / Base URL，可在前端一键切换
  models:
    - name: GLM-4-9B
      model: THUDM/GLM-4-9B-0414
      baseUrl: https://api.siliconflow.cn/v1
    - name: DeepSeek-R1-0528
      model: deepseek-ai/DeepSeek-R1-0528-Qwen3-8B
      baseUrl: https://api.siliconflow.cn/v1
    - name: Qwen3-8B
      model: Qwen/Qwen3-8B
      baseUrl: https://api.siliconflow.cn/v1
    - name: Qwen3.5-4B
      model: Qwen/Qwen3.5-4B
      baseUrl: https://api.siliconflow.cn/v1
    - name: Qwen2.5-7B
      model: Qwen/Qwen2.5-7B-Instruct
      baseUrl: https://api.siliconflow.cn/v1

# 可观测性：Actuator 端点（仅管理员可见）
management:
  endpoints:
    web:
      exposure:
        include: '*'
      base-path: /actuator
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
    enable:
      jvm: true
      system: true
      process: true
      http: true
      hikaricp: true
      jdbc: true
      data: true
      lettuce: true
      executor: true
      tomcat: true
      logback: true
      cache: true
