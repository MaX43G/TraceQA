# ============================================================
# 生产环境配置（docker-compose 已注入对应环境变量，此处仅占位引用）
# 真实密钥一律通过环境变量（.env → docker-compose）注入，本文件不含密钥。
# ============================================================
spring:
  config:
    activate:
      on-profile: prod
  ai:
    openai:
      api-key: ${LLM_API_KEY:}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:mysql}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:traceqa}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:traceqa}
    password: ${MYSQL_PASSWORD:traceqa123}
logging:
  level:
    edu.zjut.traceqa: info
