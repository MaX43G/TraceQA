# ============================================================
# 本地开发环境配置模板（不含真实密钥，可提交版本库）
# 使用：复制为 application-dev.yaml 并填入自己的密钥（该文件已被 .gitignore 忽略）
# ============================================================
spring:
  config:
    activate:
      on-profile: dev
  # 硅基流动 API Key（本地开发默认值，请替换为你的密钥）
  ai:
    openai:
      api-key: ${LLM_API_KEY:sk-your-siliconflow-api-key-here}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:traceqa}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:123456}
logging:
  level:
    edu.zjut.traceqa: info
