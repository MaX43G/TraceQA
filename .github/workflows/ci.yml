name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: 编译后端
        run: chmod +x mvnw && ./mvnw -B -q compile -DskipTests
      - name: 运行后端测试
        run: chmod +x mvnw && ./mvnw -B -q test
        env:
          LLM_API_KEY: ci-placeholder
        continue-on-error: true

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
      - name: 安装 pnpm
        run: npm install -g pnpm
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      - name: 构建前端
        run: pnpm build
      - name: 生产依赖安全审计
        run: pnpm audit --prod
        continue-on-error: true

  security-config-secret:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: 安装 Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /tmp/trivy
          /tmp/trivy/trivy --version
      - name: Trivy 扫描 (配置 + 密钥)
        run: |
          /tmp/trivy/trivy fs \
            --scanners misconfig,secret \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --skip-dirs backend,node_modules,.git \
            .

  security-vuln:
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: 安装 Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /tmp/trivy
          /tmp/trivy/trivy --version
      - name: Trivy 扫描 (后端漏洞)
        run: |
          /tmp/trivy/trivy fs \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --offline-scan \
            backend/