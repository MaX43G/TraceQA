name: Deploy

on:
  push:
    branches: [ master ]

  workflow_run:
    workflows: [ "CI" ]
    types:
      - completed
    branches:
      - master

  workflow_dispatch:
    inputs:
      environment:
        description: '部署环境'
        required: true
        default: 'production'

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: 同步代码并本地构建部署
        env:
          HOST: ${{ secrets.SERVER_HOST }}
          USER: ${{ secrets.SERVER_USER }}
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          PORT: ${{ secrets.SERVER_PORT || 22 }}
        run: |
          set -e
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          SSHOPTS="-i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -p $PORT"

          rsync -az --delete -e "ssh $SSHOPTS" \
            --exclude '.git' --exclude '.env' --exclude '.env.example' \
            --exclude 'node_modules' --exclude 'target' --exclude 'data' --exclude 'certs' \
            --exclude 'frontend/node_modules' --exclude 'frontend/.nuxt' --exclude 'frontend/.output' \
            ./ "$USER@$HOST:/opt/TraceQA/"

          ssh $SSHOPTS "$USER@$HOST" '
            set -e
            cd /opt/TraceQA
          
            echo "开始在服务器本地构建镜像并启动服务..."
            # --build 参数会强制 Docker Compose 使用本地的 Dockerfile 重新构建镜像
            docker compose up -d --build
          
            echo "等待服务启动..."
            sleep 10
          
            echo "执行健康检查..."
            curl -sf http://127.0.0.1:6114/actuator/health || (echo "健康检查未通过" && exit 1)
          '