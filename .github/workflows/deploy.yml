name: Deploy

on:
  push:
    branches: [ master ]

  workflow_run:
    workflows: [ "CI" ]
    types:
      - completed
    branches:
      - master

  workflow_dispatch:
    inputs:
      environment:
        description: '部署环境'
        required: true
        default: 'production'

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: 设置 Java 环境
        uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: 编译后端
        run: chmod +x mvnw && ./mvnw -B -q compile -DskipTests

      - name: 设置 Node.js 环境
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '26'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: 构建前端
        run: |
          npm install -g pnpm
          cd frontend
          pnpm install --frozen-lockfile
          pnpm build

  publish-backend:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
      - name: 计算 GHCR 镜像前缀（小写）
        id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: 登录 GHCR
        uses: docker/login-action@v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 构建并推送后端镜像
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}/backend:latest
            ${{ steps.meta.outputs.image }}/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-frontend:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
      - name: 计算 GHCR 镜像前缀（小写）
        id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: 登录 GHCR
        uses: docker/login-action@v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 构建并推送前端镜像
        uses: docker/build-push-action@v7.3.0
        with:
          context: ./frontend
          file: frontend/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}/frontend:latest
            ${{ steps.meta.outputs.image }}/frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: [ publish-backend, publish-frontend ]
    steps:
      - uses: actions/checkout@v7.0.1

      - name: 同步代码并部署
        env:
          HOST: ${{ secrets.SERVER_HOST }}
          USER: ${{ secrets.SERVER_USER }}
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          PORT: ${{ secrets.SERVER_PORT || 22 }}
        run: |
          set -e
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          SSHOPTS="-i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -p $PORT"

          rsync -az --delete -e "ssh $SSHOPTS" \
            --exclude '.git' --exclude '.env' --exclude '.env.example' \
            --exclude 'node_modules' --exclude 'target' --exclude 'data' --exclude 'certs' \
            --exclude 'frontend/node_modules' --exclude 'frontend/.nuxt' --exclude 'frontend/.output' \
            ./ "$USER@$HOST:/opt/TraceQA/"

          ssh $SSHOPTS "$USER@$HOST" '
            set -e
            cd /opt/TraceQA
            echo "尝试从 GHCR 拉取最新镜像..."
            if docker compose pull backend frontend; then
              echo "拉取成功，启动服务..."
              docker compose up -d --no-build
            else
              echo "GHCR 拉取失败，回退到源码构建..."
              docker compose up -d --build
            fi
            echo "等待服务启动..."
            sleep 10
            echo "执行健康检查..."
            curl -sf http://127.0.0.1:6114/actuator/health || (echo "健康检查未通过" && exit 1)
          '