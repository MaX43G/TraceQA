name: Deploy

on:
  push:
    branches: [ master ]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: 编译后端
        run: chmod +x mvnw && ./mvnw -B -q compile -DskipTests
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '26'
      - name: 构建前端
        run: |
          npm install -g pnpm
          cd frontend
          pnpm install --frozen-lockfile
          pnpm build

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7.0.1

      - name: 同步代码并部署
        env:
          HOST: ${{ secrets.SERVER_HOST }}
          USER: ${{ secrets.SERVER_USER }}
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          PORT: ${{ secrets.SERVER_PORT || 22 }}
        run: |
          set -e
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          SSHOPTS="-i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -p $PORT"
          rsync -az --delete -e "ssh $SSHOPTS" \
            --exclude '.git' --exclude '.env' --exclude '.env.example' \
            --exclude 'node_modules' --exclude 'target' --exclude 'data' --exclude 'certs' \
            --exclude 'frontend/node_modules' --exclude 'frontend/.nuxt' --exclude 'frontend/.output' \
            ./ "$USER@$HOST:/opt/TraceQA/"
          ssh $SSHOPTS "$USER@$HOST" '
            set -e
            cd /opt/TraceQA
            if docker compose pull backend frontend; then
              docker compose up -d --no-build
            else
              echo "GHCR 拉取失败，回退到源码构建"
              docker compose up -d --build
            fi
            sleep 10
            curl -sf http://127.0.0.1:6114/actuator/health || echo "健康检查未通过（可忽略）"
          '