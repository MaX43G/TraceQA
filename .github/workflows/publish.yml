name: Publish Docker Images

on:
  push:
    branches: [ master ]

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1

      - name: 计算 GHCR 镜像前缀
        id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: 登录 GHCR
        uses: docker/login-action@v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送后端镜像
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}/backend:latest
            ${{ steps.meta.outputs.image }}/backend:${{ github.sha }}

      - name: 构建并推送前端镜像
        uses: docker/build-push-action@v7.3.0
        with:
          context: ./frontend
          file: frontend/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}/frontend:latest
            ${{ steps.meta.outputs.image }}/frontend:${{ github.sha }}