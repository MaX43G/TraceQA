name: CI & Deploy

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      environment:
        description: '部署环境'
        required: true
        default: 'production'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: 编译后端
        run: chmod +x mvnw && ./mvnw -B -q compile -DskipTests
      - name: 运行后端测试
        run: chmod +x mvnw && ./mvnw -B -q test
        env:
          LLM_API_KEY: ci-placeholder
        continue-on-error: true

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '26'
      - name: 安装 pnpm
        run: |
          npm install -g pnpm
          echo "$(npm prefix -g)/bin" >> "$GITHUB_PATH"
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      - name: 构建前端
        run: pnpm build
      - name: 生产依赖安全审计
        run: pnpm audit --prod
        continue-on-error: true

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: 安装 Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /tmp/trivy
          /tmp/trivy/trivy --version
      - name: Trivy 扫描
        run: |
          /tmp/trivy/trivy fs \
            --scanners misconfig,secret \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --skip-files "**/pom.xml" \
            --skip-dirs node_modules,.git,target,frontend/node_modules,frontend/.nuxt,frontend/.output \
            .

  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7.0.1

      - name: 同步代码并部署
        env:
          HOST: ${{ secrets.SERVER_HOST }}
          USER: ${{ secrets.SERVER_USER }}
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          PORT: ${{ secrets.SERVER_PORT || 22 }}
        run: |
          set -e
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          SSHOPTS="-i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -p $PORT"

          rsync -az --delete -e "ssh $SSHOPTS" \
            --exclude '.git' --exclude '.env' --exclude '.env.example' \
            --exclude 'node_modules' --exclude 'target' --exclude 'data' --exclude 'certs' \
            --exclude 'frontend/node_modules' --exclude 'frontend/.nuxt' --exclude 'frontend/.output' \
            ./ "$USER@$HOST:/opt/TraceQA/"

          ssh $SSHOPTS "$USER@$HOST" '
            set -e
            cd /opt/TraceQA
            echo "构建并启动服务..."
            docker compose up -d --build

            echo "等待服务启动..."
            for i in $(seq 1 40); do
              if curl -sf http://127.0.0.1:6114/api/health >/dev/null 2>&1; then
                echo "健康检查通过"
                break
              fi
              sleep 5
              if [ "$i" -eq 40 ]; then
                echo "健康检查未通过"
                exit 1
              fi
            done
            echo "部署完成"
          '
