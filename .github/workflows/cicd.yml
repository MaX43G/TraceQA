name: CI & Deploy

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      environment:
        description: '部署环境'
        required: true
        default: 'production'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: 编译后端
        run: chmod +x mvnw && ./mvnw -B -q compile -DskipTests
      - name: 运行后端测试
        run: chmod +x mvnw && ./mvnw -B -q test
        env:
          LLM_API_KEY: ci-placeholder
        continue-on-error: true

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '26'
      - name: 安装 pnpm
        run: |
          npm install -g pnpm
          echo "$(npm prefix -g)/bin" >> "$GITHUB_PATH"
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      - name: 构建前端
        run: pnpm build
      - name: 生产依赖安全审计
        run: pnpm audit --prod
        continue-on-error: true

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: 安装 Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /tmp/trivy
          /tmp/trivy/trivy --version
      - name: Trivy 扫描
        run: |
          /tmp/trivy/trivy fs \
            --scanners misconfig,secret \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --skip-files pom.xml \
            --skip-dirs node_modules,.git,target,backend/target,frontend/node_modules,frontend/.nuxt,frontend/.output \
            .

  backend-vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: 构建后端镜像
        run: docker build -t traceqa-backend:scan .
      - name: 安装 Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /tmp/trivy
          /tmp/trivy/trivy --version
      - name: Trivy 扫描后端镜像漏洞
        continue-on-error: true
        run: |
          /tmp/trivy/trivy image --severity HIGH,CRITICAL --ignore-unfixed traceqa-backend:scan

  publish-backend:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: backend
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1

      - name: 计算 GHCR 镜像前缀（小写）
        id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: 登录 GHCR
        uses: docker/login-action@v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v4.3.0

      - name: 构建并推送后端镜像
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}/backend:latest
            ${{ steps.meta.outputs.image }}/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-frontend:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: frontend
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1

      - name: 计算 GHCR 镜像前缀（小写）
        id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: 登录 GHCR
        uses: docker/login-action@v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v4.3.0

      - name: 构建并推送前端镜像
        uses: docker/build-push-action@v7.3.0
        with:
          context: ./frontend
          file: frontend/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}/frontend:latest
            ${{ steps.meta.outputs.image }}/frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: [publish-backend, publish-frontend]
    steps:
      - uses: actions/checkout@v7.0.1

      - name: 同步代码并智能部署
        env:
          HOST: ${{ secrets.SERVER_HOST }}
          USER: ${{ secrets.SERVER_USER }}
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          PORT: ${{ secrets.SERVER_PORT || 22 }}
        run: |
          set -e
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          SSHOPTS="-i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -p $PORT"

          rsync -az --delete -e "ssh $SSHOPTS" \
            --exclude '.git' --exclude '.env' --exclude '.env.example' \
            --exclude 'node_modules' --exclude 'target' --exclude 'data' --exclude 'certs' \
            --exclude 'frontend/node_modules' --exclude 'frontend/.nuxt' --exclude 'frontend/.output' \
            ./ "$USER@$HOST:/opt/TraceQA/"

          ssh $SSHOPTS "$USER@$HOST" '
            set -e
            cd /opt/TraceQA
            echo "开始智能部署：尝试从 GHCR 快速拉取..."

            docker compose build > /tmp/build.log 2>&1 &
            BUILD_PID=$!
            echo "本地构建任务已启动，PID: $BUILD_PID"

            if timeout 60 docker compose pull backend frontend; then
              echo "✅ GHCR 拉取成功！正在停止构建任务..."
              kill $BUILD_PID 2>/dev/null || true
              echo "启动服务..."
              docker compose up -d --no-build
            else
              echo "⚠️ GHCR 拉取失败或超时，正在等待本地构建完成..."
              if wait $BUILD_PID; then
                echo "✅ 本地构建成功！启动服务..."
                docker compose up -d --no-build
              else
                echo "❌ 本地构建失败，请检查日志 /tmp/build.log"
                exit 1
              fi
            fi

            echo "等待服务启动..."
            sleep 10
            echo "执行健康检查..."
            curl -sf http://127.0.0.1:6114/actuator/health || (echo "健康检查未通过" && exit 1)
          '
