# 溯知 / TraceQA 文件服务配置
server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: traceqa-file-service
  main:
    web-application-type: servlet
  threads:
    virtual:
      enabled: true
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB
    encoding:
      charset: UTF-8
      enabled: true
      force: true

# MinIO 对象存储
app:
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:6116}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:traceqa}
    public-url: ${MINIO_PUBLIC_URL:}

# springdoc
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# 可观测性（Actuator / Prometheus / OpenTelemetry）
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,loggers
      base-path: /actuator
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0

logging:
  level:
    edu.zjut.traceqa: info
